function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.6*SV;master.connect(AC.destination);
    eng=AC.createOscillator();eng.type='sawtooth';eng.frequency.value=70;
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;filt=f;
    engG=AC.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(master);eng.start();
    eng2=AC.createOscillator();eng2.type='square';eng2.frequency.value=30;eng2.connect(f);eng2.start();
    turb=AC.createOscillator();turb.type='sine';turb.frequency.value=1500;turbG=AC.createGain();turbG.gain.value=0;turb.connect(turbG);turbG.connect(master);turb.start();
    var nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=nb.getChannelData(0);for(var j=0;j<nd.length;j++)nd[j]=Math.random()*2-1;
    var ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=4;sqG=AC.createGain();sqG.gain.value=0;ns.connect(bp);bp.connect(sqG);sqG.connect(master);ns.start();loadSamples();
    sirO=AC.createOscillator();sirO.type='sawtooth';sirG=AC.createGain();sirG.gain.value=0;var sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=1800;sirO.connect(sf);sf.connect(sirG);sirG.connect(master);sirO.start();

  if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur);

  if(!AC)return;var n=AC.sampleRate*.6,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);

function loadSamples(){
  ['ign','loop','boost'].forEach(function(k){
    try{

        if(k==='loop'){smpSrc=AC.createBufferSource();smpSrc.buffer=b;smpSrc.loop=true;smpG=AC.createGain();smpG.gain.value=0;smpSrc.connect(smpG);smpG.connect(master);smpSrc.start();smp=true;}

      var p=AC.decodeAudioData(b64buf(SND[k]),done,function(){});

    }catch(e){}

}

function engineSnd(on,sk){
  if(!engG)return;var an=AC.currentTime;
  if(smp){
